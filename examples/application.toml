# Application
# Comprehensive TOML configuration example.
# Demonstrates every supported TOML-facing feature.

# Account email address
# Used for account notifications
# required | Email (Text) | default: "admin@example.com"
email = "admin@example.com"

# Account username
# required | Text
username = 

# Two-letter country code
# optional | Text
country_code = 

# Maximum retry count
# optional | Number | default: 3
retries = 3

# Request timeout in seconds
# optional | Decimal | default: 5.0
timeout = 5.0

# Enable debug mode
# optional | Bool | default: false
debug = false

# Configuration creation instant
# required | OffsetDateTime
created_at = 

# Local maintenance date and time
# optional | LocalDateTime
maintenance_at = 

# Application launch date
# optional | LocalDate
launch_date = 

# Daily execution time
# optional | LocalTime
daily_time = 

# Deployment environment
# optional | Text Literal | default: "development"
environment = "development"

# Worker count preset
# optional | Number Literal | default: 4
workers = 4

# Ratio preset
# optional | Decimal Literal | default: 1.0
ratio = 1.0

# Allowed feature-switch values
# optional | Boolean Literal | default: true
feature_switch = true

# Allowed release instants
# optional | Offset Date Time Literal
release_instant = 

# Allowed local release date-times
# optional | Local Date Time Literal
local_release = 

# Allowed billing dates
# optional | Local Date Literal
billing_day = 

# Allowed backup times
# optional | Local Time Literal
backup_time = 

# Primary server
# required | Server
# Reusable server connection settings.
# Server hostname
# required | Text
primary.host = 

# Server port
# required | Port (Number)
primary.port = 

# Whether TLS is enabled
# optional | Bool | default: true
primary.tls = true

# Password used by this server
# optional | Text
# exactly one of [password, token] must be present.
primary.password = 

# Token used by this server
# optional | Text
# exactly one of [password, token] must be present.
primary.token = 

# Additional servers
# optional | Server list
# --- Server ---
# Reusable server connection settings.
# [[servers]]

# Server hostname
# required | Text
# host = 

# Server port
# required | Port (Number)
# port = 

# Whether TLS is enabled
# optional | Bool | default: true
# tls = true

# Password used by this server
# optional | Text
# exactly one of [password, token] must be present.
# password = 

# Token used by this server
# optional | Text
# exactly one of [password, token] must be present.
# token = 
# --- end Server ---

