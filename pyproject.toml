[project]
description = "A Python library for schema-based TOML configuration management with built-in validation, constraints, and type safety"
readme = "README.md"
name = "confflow"
version = "5.0.0"
authors = [
    { name = "Pedro José Mora Gallegos", email = "developmentbypedrojose@gmail.com" },
]
license = { file = "LICENSE" }
requires-python = ">=3.11"

keywords = [
    "toml",
    "configuration",
    "schema",
    "validation",
    "config-management",
    "type-checking",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = ["tomlkit>=0.13.2", "typing-extensions>=4.12.0"]

[dependency-groups]
dev = ["ruff>=0.13.1", "ty>=0.0.84"]
demo = ["ipykernel>=6.30.1", "ipython>=8.37.0"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://www.linkedin.com/in/pedro-jose-mora-gallegos"
Repository = "https://github.com/pedrojosemoragallegos/confflow"
