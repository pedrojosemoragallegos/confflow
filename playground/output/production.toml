verbose = true

[application]
name = "confflow"
environment = "production"
contact_email = "service@example.com"
debug = false
release_date = 2026-10-02
maintenance_time = 02:30:00
created_at = 2026-10-02T09:00:00
published_at = 2026-10-02T09:00:00Z
allowed_hosts = ["example.com", "api.example.com"]
retry_delays = [0.5, 1.0, 2.0, 5.0]
clusters = [["node-a", "node-b"], ["node-c", "node-d"]]

[application.server]
host = "localhost"
port = 8080
tls = false

[application.server.limits]
minimum_workers = 2
maximum_workers = 16

[application.authentication]
username = "service"
password = "example-secret"

[application.notifications]
email = "alerts@example.com"

[application.storage]
local_path = "/var/lib/confflow"

[application.replication]
primary_protocol = "https"
replica_protocol = "https"
primary_id = "primary"
replica_id = "replica"

[application.ports]
http = 80
https = 443

[[application.backends]]
name = "primary"
url = "https://primary.example.com"
timeout = 5.0

[[application.backends]]
name = "replica"
url = "https://replica.example.com"
timeout = 10.0

[monitoring]
endpoint = "https://monitoring.example.com"
