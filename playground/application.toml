# Application configuration

# Verbose logging
# Optional | boolean | false
verbose = false

# Application configuration
# Required
[application]
# Application name
# Required | string | "confflow"
# Length must be between 1 and 64
name = "confflow"
# Deployment environment
# Required | string | "production"
# Value must be one of "development", "staging", or "production"
environment = "production"
# Application contact email
# Optional | string
contact_email =
# Debug mode
# Required | boolean | false
debug = false
# Current load factor
# Required | float | 0.5
# Value must be between 0.0 and 1.0
load_factor = 0.5
# Application release date
# Required | local date | 2026-10-02
release_date = 2026-10-02
# Daily maintenance time
# Required | local time | 02:30:00
maintenance_time = 02:30:00
# Local creation timestamp
# Required | local date-time | 2026-10-02T09:00:00
created_at = 2026-10-02T09:00:00
# Publication timestamp
# Required | offset date-time | 2026-10-02T09:00:00Z
published_at = 2026-10-02T09:00:00Z
# Hosts accepted by the application
# Optional | array of string
# Length must be between 1 and 255
allowed_hosts =
# Retry delays in seconds
# Optional | array of float
# Value must be between 0.0 and 60.0
retry_delays =
# Enabled feature flags
# Optional | array of boolean
feature_flags =
# Retryable response codes
# Optional | array of integer
# Value must be between 100 and 599
retry_codes =
# Scheduled maintenance dates
# Optional | array of local date
maintenance_dates =
# Daily quiet-hour start times
# Optional | array of local time
quiet_hours =
# Scheduled local health checks
# Optional | array of local date-time
scheduled_checks =
# Offset-aware audit timestamps
# Optional | array of offset date-time
audit_timestamps =
# Groups of cluster node names
# Optional | array of array of string
clusters =

# HTTP server configuration
# Required
[application.server]
# Server host
# Required | string | "localhost"
# Length must be between 1 and 255
host = "localhost"
# Server port
# Required | integer | 8080
# Value must be between 1 and 65535
port = 8080
# TLS mode
# Required | boolean | false
tls = false

# Worker limits
# Required
# "minimum_workers" must be <= "maximum_workers"
[application.server.limits]
# Minimum worker count
# Required | integer | 2
# Value must be between 1 and 128
minimum_workers = 2
# Maximum worker count
# Required | integer | 16
# Value must be between 1 and 128
maximum_workers = 16

# Examples of ordered comparison constraints
# Required
[application.comparison_examples]

# Strictly increasing values
# Required
# "smaller" must be < "larger"
[application.comparison_examples.less_than]
# Required | integer | 1
smaller = 1
# Required | integer | 2
larger = 2

# Increasing or equal values
# Required
# "lower" must be <= "upper"
[application.comparison_examples.less_than_or_equal]
# Required | integer | 2
lower = 2
# Required | integer | 2
upper = 2

# Strictly decreasing values
# Required
# "larger" must be > "smaller"
[application.comparison_examples.greater_than]
# Required | integer | 2
larger = 2
# Required | integer | 1
smaller = 1

# Decreasing or equal values
# Required
# "left" must be >= "right"
[application.comparison_examples.greater_than_or_equal]
# Required | integer | 2
left = 2
# Required | integer | 2
right = 2

# Authentication configuration
# Optional
# When "username" is provided, "password" must also be provided
# Either "password" or "token" may be provided, but not both
# When either "certificate" or "private_key" is provided, both must be provided
[application.authentication]
# Authentication username
# Optional | string
username =
# Authentication password
# Optional | string | secret
# Value must satisfy length
password =
# Authentication token
# Optional | string | secret
token =
# Client certificate
# Optional | string
certificate =
# Client private key
# Optional | string | secret
private_key =

# Notification delivery
# Required
# Either "email" or "webhook" must be provided; both may be provided
[application.notifications]
# Notification email address
# Optional | string
email =
# Notification webhook URL
# Optional | string
webhook =

# Storage backend selection
# Required
# Either "local_path" or "bucket", but not both, must be provided
# When "local_path" is provided, "region" must be omitted
[application.storage]
# Local storage directory
# Optional | string
local_path =
# Cloud storage bucket
# Optional | string
bucket =
# Cloud storage region
# Optional | string
region =

# Replication compatibility and identity
# Required
# "primary_protocol" == "replica_protocol"
# "primary_id" != "replica_id"
[application.replication]
# Primary replication protocol
# Required | string
primary_protocol =
# Replica replication protocol
# Required | string
replica_protocol =
# Primary node identifier
# Required | string
primary_id =
# Replica node identifier
# Required | string
replica_id =

# Named service ports
# Optional | table
[application.ports]
# --- <copy block> ---
# # Port number
# # Required | integer
# # Value must be between 1 and 65535
# <key> =
# --- </copy block> ---

# Named service configurations
# Optional | table
[application.services]
# --- <copy block> ---
# # Service configuration
# # Required
# [application.services.<key>]
# # Service URL
# # Required | string
# # Length must be at least 1
# url =
# # Traffic weight
# # Required | integer | 1
# # Value must be at least 1
# weight = 1
# --- </copy block> ---

# Backend server definitions
# Optional | array of tables
# --- <copy block> ---
# [[application.backends]]
# # Backend role
# # Required | string
# # Value must be one of "primary" or "replica"
# name =
# # Backend URL
# # Required | string
# # Length must be at least 1
# url =
# # Request timeout in seconds
# # Optional | float | 5.0
# # Value must be between 0.0 and 60.0
# timeout = 5.0
# --- </copy block> ---

# Application monitoring
# Optional
[monitoring]
# Monitoring endpoint
# Required | string
# Length must be at least 1
endpoint =
