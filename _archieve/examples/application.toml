# Application
# Comprehensive TOML configuration example.
# Demonstrates every supported TOML-facing feature.

# Application display name
# optional | Text
application_name = 

# First mutually exclusive option
# optional | Text
# at most one of [mutually_exclusive_left, mutually_exclusive_right] may be present.
mutually_exclusive_left = 

# Second mutually exclusive option
# optional | Text
# at most one of [mutually_exclusive_left, mutually_exclusive_right] may be present.
mutually_exclusive_right = 

# First exactly-one option
# optional | Text
# exactly one of [exactly_one_left, exactly_one_right] must be present.
exactly_one_left = 

# Second exactly-one option
# optional | Text
# exactly one of [exactly_one_left, exactly_one_right] must be present.
exactly_one_right = 

# First at-least-one option
# optional | Text
# at least one of [at_least_one_left, at_least_one_right] must be present.
at_least_one_left = 

# Second at-least-one option
# optional | Text
# at least one of [at_least_one_left, at_least_one_right] must be present.
at_least_one_right = 

# First all-or-none option
# optional | Text
# [all_or_none_left, all_or_none_right] must either all be present or all be absent.
all_or_none_left = 

# Second all-or-none option
# optional | Text
# [all_or_none_left, all_or_none_right] must either all be present or all be absent.
all_or_none_right = 

# Source of a requires rule
# optional | Text
# requires_source requires requires_target.
requires_source = 

# Required target
# optional | Text
# requires_source requires requires_target.
requires_target = 

# Source of a requires-any rule
# optional | Text
# requires_any_source requires at least one of [requires_any_left, requires_any_right].
requires_any_source = 

# First requires-any target
# optional | Text
# requires_any_source requires at least one of [requires_any_left, requires_any_right].
requires_any_left = 

# Second requires-any target
# optional | Text
# requires_any_source requires at least one of [requires_any_left, requires_any_right].
requires_any_right = 

# Source of a requires-all rule
# optional | Text
# requires_all_source requires all of [requires_all_left, requires_all_right].
requires_all_source = 

# First requires-all target
# optional | Text
# requires_all_source requires all of [requires_all_left, requires_all_right].
requires_all_left = 

# Second requires-all target
# optional | Text
# requires_all_source requires all of [requires_all_left, requires_all_right].
requires_all_right = 

# Source of a forbids rule
# optional | Text
# forbids_source forbids forbids_target.
forbids_source = 

# Forbidden target
# optional | Text
# forbids_source forbids forbids_target.
forbids_target = 

# Source of a forbids-any rule
# optional | Text
# forbids_any_source forbids any of [forbids_any_left, forbids_any_right].
forbids_any_source = 

# First forbids-any target
# optional | Text
# forbids_any_source forbids any of [forbids_any_left, forbids_any_right].
forbids_any_left = 

# Second forbids-any target
# optional | Text
# forbids_any_source forbids any of [forbids_any_left, forbids_any_right].
forbids_any_right = 

# Account settings
# optional | Table

[account]
# Account email address
# Used for account notifications
# required | Email (Text) | default: "admin@example.com"
email = "admin@example.com"

# Account username
# required | Text
username = 

# Two-letter country code
# optional | Text
country_code = 

# Lifecycle settings
# optional | Table

[lifecycle]
# Configuration creation instant
# required | OffsetDateTime
created_at = 

# Local maintenance date and time
# optional | LocalDateTime
maintenance_at = 

# Application launch date
# optional | LocalDate
launch_date = 

# Daily execution time
# optional | LocalTime
daily_time = 

# Deployment settings
# optional | Table

[deployment]
# Deployment environment
# optional | Text Literal | default: "development"
environment = "development"

# Worker count preset
# optional | Number Literal | default: 4
workers = 4

# Ratio preset
# optional | Decimal Literal | default: 1.0
ratio = 1.0

# Allowed release instants
# optional | Offset Date Time Literal
release_instant = 

# Allowed local release date-times
# optional | Local Date Time Literal
local_release = 

# Allowed billing dates
# optional | Local Date Literal
billing_day = 

# Allowed backup times
# optional | Local Time Literal
backup_time = 

# Server settings
# optional | Table

[server_settings]
# Primary server
# required | Table

[server_settings.primary]
# Server hostname
# required | Text
host = 

# Server port
# required | Port (Number)
port = 

# Whether TLS is enabled
# optional | Bool | default: true
tls = true

# Password used by this server
# optional | Text
# exactly one of [password, token] must be present.
password = 

# Token used by this server
# optional | Text
# exactly one of [password, token] must be present.
token = 

